[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-automation"
version = "0.1.0"
description = "議事録からマニュアル自動生成 & Miro業務フロー描画ツール"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "anthropic>=0.40",
    "notion-client>=2.0",
    "md2notionpage>=0.1",
    "miro-api>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "streamlit>=1.30",
]

[project.scripts]
manual-tool = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
